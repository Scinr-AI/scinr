site_name: scinr documentation
site_description: AI-powered document knowledge library for life sciences — scinr.newton document ingestion engine
site_url: https://scinr-ai.github.io/scinr/

exclude_docs: |
  superpowers/*


theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - User Guides:
      - Quick Start: user-guides/quick-start.md
      - Running the Pipeline: user-guides/running-pipeline.md
      - Custom Themes: user-guides/custom-themes.md
      - Custom Models: user-guides/custom-models.md
      - Model Design Patterns: user-guides/model-patterns.md
      - Graph Relationships: user-guides/graph-relationships.md
      - Normalization: user-guides/normalization.md
      - Tabular Pipeline: user-guides/tabular-pipeline.md
      - Neo4j Graph Storage: user-guides/neo4j-graph.md
      - Graph Navigation: user-guides/graph-navigation.md
      - Document Deletion: user-guides/document-deletion.md
      - Storage Backends: user-guides/storage-backends.md
      - Performance Tuning: user-guides/performance-tuning.md
  - API Reference:
      - Overview: api/index.md
      - Pipeline (run_pipeline): api/pipeline.md
      - Configuration (configure): api/config.md
      - Stages: api/stages.md
      - Normalization: api/normalization.md
      - Converters: api/converters.md
      - Storage: api/storage.md
      - Navigation: api/navigation.md
      - Utilities: api/utilities.md
      - Exceptions: api/exceptions.md
      - Deletion (delete_document): api/deletion.md
      - Results: api/results.md
