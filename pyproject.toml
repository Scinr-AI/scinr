[project]
name = "scinr"
version = "0.6.0"
description = "AI-powered document knowledge library for life sciences — scinr.newton document ingestion engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Scinr AI"}]
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    # converters
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "jsonpath-ng>=1.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "Pillow>=10.3",
    "pypdf>=5.0",  # PDF splitting
    "tiktoken>=0.13",  # token-count estimation for consolidation batching (o200k_base approximation)
    "ijson>=3.2",  # incremental JSON parsing of document snapshots (restore_document)
]

[project.optional-dependencies]
bedrock = ["langchain-aws>=0.2", "boto3>=1.34"]
openai = ["langchain-openai>=0.2"]
ollama = ["langchain-ollama>=0.1"]
neo4j = ["neo4j>=5.0"]
mongodb = ["motor>=3.3", "pymongo>=4.6"]
postgres = ["sqlalchemy[asyncio]>=2.0.30", "psycopg[binary]>=3.1.18"]
sqlite = ["sqlalchemy[asyncio]>=2.0.30", "aiosqlite>=0.20"]
# Local transcription (faster-whisper) and HEIC/HEIF images. ffmpeg / ffprobe are
# system binaries required for audio and video; they are not installed by pip.
media = ["faster-whisper>=1.0", "pillow-heif>=0.16"]
docs = [
    "mkdocs-material==9.5.30",
    "mkdocstrings[python]==1.0.6",
    "griffe==2.1.0",
    "ruff==0.15.20",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "neo4j>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "aiosqlite>=0.20",
]

[project.entry-points."scinr.newton.models"]
# Built-in default models are always included.
# External model packages register here.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scinr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires running Neo4j and/or MongoDB",
    "sql_rls: Postgres Row-Level-Security suite (restricted roles); needs the postgres-test container",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
