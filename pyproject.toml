[project]
name = "scinr"
version = "0.3.3"
description = "AI-powered document knowledge library for life sciences — scinr.newton document ingestion engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Scinr AI"}]
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "neo4j>=5.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    # converters
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "jsonpath-ng>=1.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "Pillow>=10.3",
    "pdfplumber>=0.11",
    "pypdf>=5.0",  # PDF splitting
    "tiktoken>=0.13",  # token-count estimation for consolidation batching (o200k_base approximation)
]

[project.optional-dependencies]
bedrock = ["langchain-aws>=0.2", "boto3>=1.34"]
openai = ["langchain-openai>=0.2"]
ollama = ["langchain-ollama>=0.1"]
mongodb = ["motor>=3.3", "pymongo>=4.6"]
docs = [
    "mkdocs-material==9.5.30",
    "mkdocstrings[python]==1.0.6",
    "griffe==2.1.0",
    "ruff==0.15.20",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
]


[project.scripts]
newton = "scinr.newton.cli:main_sync"

[project.entry-points."scinr.newton.models"]
# Built-in default models are always included.
# External model packages register here.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scinr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires running Neo4j and/or MongoDB"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
